train:
  seed: 0
  total_steps: 80
  max_episode_steps: 20
  log_interval: 20
  save_interval: 1000
  eval_interval: 500
  eval_episodes: 0
  record_interval: 20
  device: cpu
  multi_task: false
env:
  type: dmcontrol
  name: cartpole_swingup
  domain_name: cartpole
  task_name: swingup
  observation:
    type: vector
    num_cams: 0
  action:
    clip: true
    normalize: true
  render:
    enabled: false
    save_frames: false
    save_video: false
    height: 240
    width: 320
    camera_id: 0
  isaac:
    task_name: null
    num_envs: 1
    headless: true
    create_cam: null
policy:
  type: dreamerv3
  name: dreamerv3_vector_smoke
  checkpoint:
    load: false
    path: policy.ckpt
    save: true
  dreamerv3:
    device: cpu
    batch_size: 4
    seq_len: 8
    warmup_steps: 16
    train_every: 1
    train_ratio: 1.0
    max_updates_per_step: 1
    replay_capacity: 2000
    embed_dim: 64
    deter_dim: 64
    stoch_dim: 8
    stoch_classes: 8
    hidden_dim: 128
    num_layers: 2
    actor_hidden_dim: 128
    actor_num_layers: 2
    value_hidden_dim: 128
    value_num_layers: 2
    world_model_lr: 3.0e-4
    actor_lr: 8.0e-5
    value_lr: 8.0e-5
    gamma: 0.99
    lambda_: 0.95
    imagination_horizon: 8
    entropy_coef: 1.0e-3
    grad_clip: 100.0
    actor_grad_clip: 100.0
    value_grad_clip: 100.0
    min_std: 0.1
    max_std: 1.0
    init_std: 1.0
    imag_last: 0
    use_symlog_obs: true
    use_symlog_reward: true
    use_twohot_reward: true
    use_twohot_value: true
    free_nats: 1.0
    kl_balance: 0.8
    twohot_bins: 63
    twohot_low: -20.0
    twohot_high: 20.0
    rssm_unimix: 0.01
    use_slow_value: true
    slow_value_rate: 0.02
    repval_loss: true
    repval_scale: 0.3
    use_return_norm: true
    use_advantage_norm: true
    norm_rate: 0.01
    norm_eps: 1.0e-8
    priority_replay: false
    aux:
      predict_grasp: false
      contact_num_classes: null
