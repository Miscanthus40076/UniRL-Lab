train:
  seed: 0
  total_steps: 30000
  max_episode_steps: 500
  log_interval: 200
  save_interval: 5000
  eval_interval: 5000
  eval_episodes: 1000
  eval_visualize_episodes: 10
  eval_success_metric: info_success
  eval_success_threshold: 0.0
  record_interval: 200
  device: cuda
  multi_task: false
env:
  type: dmcontrol
  name: ball_in_cup_release
  domain_name: ball_in_cup
  task_name: release
  observation:
    type: image
    num_cams: 1
  action:
    clip: true
    normalize: true
  render:
    enabled: false
    save_frames: false
    save_video: false
    height: 64
    width: 64
    camera_id: 0
    backend: null
    backend_priority: [egl, osmesa]
    allow_software_render_fallback: true
  isaac:
    task_name: null
    num_envs: 1
    headless: true
    create_cam: null
policy:
  type: dreamerv3
  name: dreamerv3_ball_in_cup_release_30k
  checkpoint:
    load: false
    path: policy.ckpt
    save: true
  dreamerv3:
    device: cuda
    allow_cpu_fallback: false
    batch_size: 16
    seq_len: 16
    warmup_steps: 1000
    train_every: 1
    train_ratio: 1.0
    max_updates_per_step: 1
    replay_capacity: 100000
    embed_dim: 128
    deter_dim: 128
    stoch_dim: 16
    stoch_classes: 16
    hidden_dim: 256
    num_layers: 2
    actor_hidden_dim: 256
    actor_num_layers: 2
    value_hidden_dim: 256
    value_num_layers: 2
    world_model_lr: 3.0e-4
    actor_lr: 8.0e-5
    value_lr: 8.0e-5
    gamma: 0.99
    lambda_: 0.95
    imagination_horizon: 15
    entropy_coef: 1.0e-3
    grad_clip: 100.0
    actor_grad_clip: 100.0
    value_grad_clip: 100.0
    min_std: 0.1
    max_std: 1.0
    init_std: 1.0
    imag_last: 0
    use_symlog_obs: false
    use_symlog_reward: true
    use_twohot_reward: true
    use_twohot_value: true
    free_nats: 1.0
    kl_balance: 0.8
    twohot_bins: 255
    twohot_low: -20.0
    twohot_high: 20.0
    rssm_unimix: 0.01
    use_slow_value: true
    slow_value_rate: 0.02
    repval_loss: true
    repval_scale: 0.3
    use_return_norm: true
    use_advantage_norm: true
    norm_rate: 0.01
    norm_eps: 1.0e-8
    priority_replay: false
    aux:
      predict_grasp: false
      contact_num_classes: null
