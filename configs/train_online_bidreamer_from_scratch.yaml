env:
  type: dmcontrol
  name: ball_in_cup_catch
  domain_name: ball_in_cup
  task_name: catch
  observation:
    type: image
    num_cams: 1
  action:
    clip: true
    normalize: true
  render:
    enabled: true
    save_frames: false
    save_video: false
    height: 64
    width: 64
    camera_id: 0
    backend: null
    backend_priority: [egl, osmesa]
    allow_software_render_fallback: true
  isaac:
    task_name: null
    num_envs: 1
    headless: true
    create_cam: null

forward_env:
  name: ball_in_cup_catch
  domain_name: ball_in_cup
  task_name: catch

reverse_env:
  name: ball_in_cup_release
  domain_name: ball_in_cup
  task_name: release

sanity:
  num_reset_images: 2
  random_rollout_steps: 50
  gif_fps: 20

replay:
  capacity: 10000

model:
  action_dim: 2
  embed_dim: 128
  deter_dim: 128
  stoch_dim: 16
  stoch_classes: 16
  hidden_dim: 256
  actor_hidden_dim: 256
  actor_num_layers: 2
  value_hidden_dim: 256
  value_num_layers: 2
  free_nats: 1.0
  kl_balance: 0.8
  unimix: 0.01
  separate_continue_heads: false

training:
  total_env_steps: 100000
  warmup_env_steps_per_direction: 50
  batch_size: 4
  seq_len: 8
  learning_rate: 0.0003
  actor_lr: 0.00008
  value_lr: 0.00008
  grad_clip: 100.0
  actor_grad_clip: 100.0
  value_grad_clip: 100.0
  imagination_horizon: 8
  gamma: 0.99
  lambda: 0.95
  entropy_coef: 0.001
  min_std: 0.1
  max_std: 1.0
  init_std: 1.0
  imag_last: 0
  use_twohot_value: true
  use_slow_value: true
  slow_value_rate: 0.02
  repval_loss: false
  repval_scale: 0.3
  use_return_norm: true
  use_advantage_norm: true
  norm_rate: 0.01
  norm_eps: 0.00000001
  eval_interval: 50
  device: cuda_if_available_else_cpu

eval:
  episodes_per_direction: 2
  max_episode_steps: 200
  deterministic: false
  save_gif: true
  gif_fps: 20

loss:
  recon_scale: 1.0
  reward_scale_forward: 1.0
  reward_scale_reverse: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  contact_scale: 0.2
  grasp_scale: 0.2
  forward_loss_scale: 1.0
  reverse_loss_scale: 1.0

ablation:
  train_actor: true
  train_value: true
  latent_prior_enabled: true

latent_prior:
  enabled: true
  start_after_env_steps: 10000
  memory_update_interval: 200
  beta: 1.0
  horizon: 3
  subgoal_step: 1
  num_visualize_neighbors: 8

latent_memory:
  use_success_only: true
  distance_metric: cosine
  normalize_features: true
  feature_whiten: false
  store_obs: true
  subgoal_step: 1
