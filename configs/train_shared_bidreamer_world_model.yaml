data:
  forward_path: outputs/datasets/ball_cup_forward_dreamer_trajectories_seed_0.npz
  reverse_path: outputs/datasets/ball_cup_reverse_dreamer_trajectories_seed_0.npz
  train_val_split: episode
  val_ratio: 0.2
  action_alignment: env_step_current
  store_obs_in_reverse_memory: true

model:
  obs_type: image
  action_dim: 4
  embed_dim: 128
  deter_dim: 128
  stoch_dim: 32
  stoch_classes: 32
  hidden_dim: 256
  free_nats: 1.0
  kl_balance: 0.8
  unimix: 0.01
  separate_continue_heads: false

training:
  seed: 0
  train_steps: 50000
  batch_size: 32
  seq_len: 32
  learning_rate: 0.0003
  grad_clip: 100.0
  eval_interval: 1000
  device: cuda_if_available_else_cpu

loss:
  recon_scale: 1.0
  reward_scale_forward: 1.0
  reward_scale_reverse: 1.0
  continue_scale: 1.0
  kl_scale: 1.0
  contact_scale: 0.2
  grasp_scale: 0.2
  forward_loss_scale: 1.0
  reverse_loss_scale: 1.0

eval:
  open_loop_horizons: [1, 3, 5, 10]
  num_eval_batches: 50
  num_visualize_neighbors: 16

latent_memory:
  subgoal_step: 1
  use_success_only: true
  distance_metric: cosine
  normalize_features: true
  feature_whiten: false
